<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D5D6D7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>norns canvas / U-MA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@700&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#D5D6D7; --paper:#EFEFEE; --ink:#111111; --muted:#5B5C5E; --line:#111111; --soft:rgba(17,17,17,.2); --chip:#EFEFEE;
  --or:#C2185B; --on-or:#ffffff; --sel:#1FA3C7; --cya:#1FA3C7; --yel:#D6B21E; --mag:#C2185B;
  --tex:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,rgba(0,0,0,.025) 1px 3px,rgba(255,255,255,.08) 3px 4px);
  --disp:"Barlow Condensed",Impact,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E0F10;--paper:#1B1C1E;--ink:#E9E9E8;--muted:#9A9B9D;--line:#E9E9E8;--soft:rgba(255,255,255,.16);--chip:#1B1C1E;--or:#C2185B;--tex:none;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E0F10;--paper:#1B1C1E;--ink:#E9E9E8;--muted:#9A9B9D;--line:#E9E9E8;--soft:rgba(255,255,255,.16);--chip:#1B1C1E;--or:#C2185B;--tex:none;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);background-image:var(--tex);color:var(--ink);font:14px/1.4 "IBM Plex Mono",ui-monospace,Menlo,monospace;-webkit-tap-highlight-color:transparent}
.app{max-width:580px;margin:0 auto;padding:10px 6px 30px;overflow-x:clip}
.device{overflow:hidden}
button{font:600 11.5px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);background:var(--chip);border:1.5px solid var(--line);border-radius:0;padding:6px 9px;min-height:36px;cursor:pointer}
button.primary{background:var(--or);color:var(--on-or)}
button[aria-pressed="true"]{background:var(--cya);color:#0B0B0B;border-color:var(--cya)}
button:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.knob:focus-visible{outline:2px solid var(--cya);outline-offset:2px}
svg.px{width:18px;height:18px;display:block}
input,select,textarea{font:13px/1.3 "IBM Plex Mono",monospace;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:0;padding:7px 8px;width:100%}
input[type=checkbox]{width:auto;accent-color:var(--or)}
label{display:block;font:500 10px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 5px}
.check{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--ink);font-size:12px;text-transform:none;letter-spacing:0}
.hint{font-size:11px;color:var(--muted);margin:8px 0 0;line-height:1.45}

/* header */
.top{display:flex;align-items:center;gap:5px;margin-bottom:8px}
.top .sp{flex:1}
.logo{flex:none;width:70px;display:grid;place-items:center}
.logo svg{width:70px;height:auto;display:block;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.2))}
.brand{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:stretch;align-self:stretch}
.brand .bt{flex:1;min-width:0;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;border-right:1.5px solid var(--line)}
.brand .bi{width:34px;min-width:34px;padding:0;border:0;border-left:1px solid var(--soft);display:grid;place-items:center;background:transparent}
.brand .bi:first-of-type{border-left:0}
.brand .bi svg.px{width:16px;height:16px}
.brand .bl{font:500 8.5px/1 "IBM Plex Mono",monospace;font-style:normal;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.brand{border-width:2px;box-shadow:3px 3px 0 rgba(0,0,0,.18)}
.brand b{font:800 23px/.95 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.brand .bt span{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.icon{width:38px;padding:0;display:inline-grid;place-items:center}

/* bloques tipo etiqueta */
.blk{background:var(--paper);border:1.5px solid var(--line);margin-top:10px;position:relative}
.blk{color:var(--ink)}
.p-ink{--paper:#111111;--chip:#111111;--ink:#EFEFEE;--line:#EFEFEE;--soft:rgba(255,255,255,.2);--muted:#9A9B9D;--or:#1FA3C7;--on-or:#0B0B0B}
.p-yel{--paper:#D6B21E;--chip:#D6B21E;--ink:#101010;--line:#101010;--soft:rgba(0,0,0,.3);--muted:rgba(0,0,0,.66);--or:#101010;--on-or:#D6B21E}
.p-mag{--paper:#C2185B;--chip:#C2185B;--ink:#101010;--line:#101010;--soft:rgba(0,0,0,.32);--muted:rgba(0,0,0,.68);--or:#101010;--on-or:#C2185B}
.patbox{border-top:1.5px solid var(--line);margin-top:12px}
.libq{margin:0 0 8px}
.blk{border-width:2px;box-shadow:3px 3px 0 rgba(0,0,0,.18)}
.tag{display:grid;grid-template-columns:auto minmax(0,1fr) auto;border-bottom:2px solid var(--line)}
.tag .c{padding:7px 10px 8px;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;border-right:1.5px solid var(--line)}
.tag .c:last-child{border-right:0;text-align:right;align-items:flex-end;max-width:46vw}
.tag i{font:500 8.5px/1 "IBM Plex Mono",monospace;font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;white-space:nowrap}
.tag .ttl i::after{content:"";display:inline-block;vertical-align:middle;width:28px;height:6px;margin-left:8px;background:linear-gradient(90deg,var(--mag) 0 8px,transparent 8px 10px,var(--cya) 10px 18px,transparent 18px 20px,var(--yel) 20px 28px);box-shadow:0 0 0 1px var(--line)}
.tag b{font:800 46px/.78 var(--disp);letter-spacing:-.03em;color:var(--ink)}
.tag .ttl span{font:800 22px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .val span{font:600 11px/1.2 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.p-mag .tag .ttl i::after,.p-yel .tag .ttl i::after{box-shadow:0 0 0 1.5px #101010}
.pad{padding:10px 12px 14px}
.haz{height:12px;background:repeating-linear-gradient(-45deg,#111 0 7px,var(--yel) 7px 14px);border:2px solid #111;margin-top:6px}

/* hardware */
.device{position:relative;background:#121314;color:#d6d4cc;border:2px solid #000;padding:0 7px 10px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font:500 9px/1 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em;color:#8d8c88;padding:7px 1px 6px}
.dhead b{color:var(--cya);font-weight:700}
.dbtn{display:flex;gap:4px;flex:none}
.device .dbtn button{min-height:26px;padding:4px 8px;font-size:10px}
.device .dbtn button.primary{background:var(--mag);color:#fff;border-color:var(--mag)}
.dhead>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen{display:grid;grid-template-columns:minmax(0,1fr) 22px;grid-template-rows:auto 22px;gap:4px}
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);background-image:var(--tex);padding-top:6px;margin-top:-6px}
.stick.off{position:static}
.stick{padding-bottom:0}
.device.dev1{border-bottom:0;padding-bottom:6px;box-shadow:none}
.device.dev2{border-top:0;padding-top:0;position:relative;z-index:1}
.dev2 .zbar{padding-top:4px}
.tabs,#panel,.blk{scroll-margin-top:calc(var(--stk,0px) + 8px)}
.bezel{background:#000;border:1.5px solid #3a3a3a;min-width:0;overflow:hidden}
#scroller{overflow:hidden}
#frame{padding:17px 8px;width:max-content;min-width:100%}
#stage{position:relative;margin:0 auto;box-shadow:0 0 0 1px rgba(255,176,32,.45)}
#scr,#ovl{position:absolute;left:0;top:0;display:block}
#scr{image-rendering:pixelated;image-rendering:crisp-edges}
#ovl{touch-action:none;cursor:crosshair}
.cm{position:absolute;width:14px;height:14px;border:0 solid #ffb020;pointer-events:none}
.cm.tl{left:-5px;top:-5px;border-left-width:2px;border-top-width:2px}
.cm.tr{right:-5px;top:-5px;border-right-width:2px;border-top-width:2px}
.cm.bl{left:-5px;bottom:-5px;border-left-width:2px;border-bottom-width:2px}
.cm.br{right:-5px;bottom:-5px;border-right-width:2px;border-bottom-width:2px}
.cl{position:absolute;font:500 9px/1 "IBM Plex Mono",monospace;color:#9a8a6a;pointer-events:none;white-space:nowrap}
.cl.a{left:12px;top:-14px}.cl.b{right:12px;bottom:-14px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--or);margin:0}
.xs{width:100%;height:22px}
.ys{writing-mode:vertical-lr;direction:ltr;width:22px;height:100%}
.xs:disabled,.ys:disabled{opacity:.25}
.corner{font:500 8px/22px "IBM Plex Mono",monospace;color:#6d6c68;text-align:center}
.zbar{display:flex;align-items:center;gap:5px;padding:8px 0 0}
.device button{background:#1c1c1d;border-color:#4a4a4c;color:#e2e0d8}
.device button[aria-pressed="true"]{background:var(--cya);color:#0B0B0B;border-color:var(--cya)}
.zbar .sq{width:36px;padding:0;font-size:16px}
.zl{font:500 10px/1 "IBM Plex Mono",monospace;color:#b8b6ae;min-width:44px;text-align:center}
.sp{flex:1}
.polybar{display:none;align-items:center;gap:6px;padding:8px 0 0;font-size:11px;color:#ffb020;text-transform:uppercase}
.polybar.on{display:flex}
.readout{display:flex;justify-content:space-between;gap:10px;font:500 10px/1 "IBM Plex Mono",monospace;color:#8f8e89;padding:9px 1px 2px;text-transform:uppercase}
.readout span:last-child{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hw{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-items:start;padding-top:10px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:5px}
.ctl .lab{font:700 10px/1 "IBM Plex Mono",monospace;color:#cfcdc4}
.ctl .fn{font-size:9px;line-height:1.1;color:#7f7e7a;text-align:center;text-transform:uppercase}
.device .key{width:34px;height:34px;min-height:0;padding:0;border-radius:50%;border:1px solid #000;background:radial-gradient(circle at 40% 35%,#4c4e53,#1a1b1e);box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.1)}
.device .key:active{transform:translateY(2px);box-shadow:none}
.knob{width:40px;height:40px;border-radius:50%;position:relative;touch-action:none;cursor:ew-resize;background:radial-gradient(circle at 40% 33%,#e0ded6,#94928b 68%,#696862);box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 -2px 3px rgba(0,0,0,.3)}
.knob i{position:absolute;left:50%;top:4px;width:2px;height:11px;margin-left:-1px;background:#24262a;transform-origin:1px 16px}

/* herramientas */
.tools{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.tool{height:44px;display:grid;place-items:center;padding:0}
.tool svg.px{width:20px;height:20px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1}
.levels{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.lv{height:30px;min-height:0;padding:2px 4px;font:700 9px/1 "IBM Plex Mono",monospace;display:flex;align-items:flex-end;justify-content:flex-end;border-width:1px}
.lv[aria-pressed="true"]{outline:3px solid var(--or);outline-offset:-3px}

/* IA */
.ai .in{display:flex;gap:6px}
.ai input[type=text]{flex:1}
.ai .st{font-size:11px;color:var(--muted);margin:8px 0 0;min-height:1em}

/* pestañas y listas */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-top:12px}
.tab{border-right-width:0}
.tab:last-child{border-right-width:1.5px}
.tab{font:800 16px/1 var(--disp);letter-spacing:.03em;border-width:2px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
#panel{border:2px solid var(--line);border-top:0;background:var(--paper);padding:8px;box-shadow:3px 3px 0 rgba(0,0,0,.18)}
.row{display:flex;align-items:center;gap:4px;padding:3px 0;border-bottom:1px solid var(--soft)}
.row .name{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;font:500 13px/1.2 "IBM Plex Mono",monospace;letter-spacing:0}
.row .dim{color:var(--muted)}
.row.lay{border-bottom:1.5px solid var(--line);background:var(--bg)}
.row.lay .name{font-weight:700}
.row.lay.cur{box-shadow:inset 4px 0 0 var(--mag)}
.row.child{padding-left:14px}
.row.child2{padding-left:30px}
.row.grp .name{font-weight:700}
.row.sel{background:rgba(42,158,191,.2);box-shadow:inset 3px 0 0 var(--sel)}
.row .ic{width:32px;min-width:32px;min-height:32px;padding:0;display:inline-grid;place-items:center;background:none;border:0}
.row .ic svg.px{width:15px;height:15px}
.row .ic.on{color:var(--or)}
.row .mv{width:30px;min-width:30px;padding:0}
.lvtag{font:500 9px/1 "IBM Plex Mono",monospace;color:var(--muted);white-space:nowrap;padding:0 3px}
.caret{width:24px;min-width:24px;padding:0;background:none;border:0;color:var(--muted);font-size:12px}
.tree{max-height:48vh;overflow:auto;position:relative}
.bar{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.thumb{flex:none;padding:3px 3px 2px;background:#000;border:1.5px solid var(--line);min-height:0;color:#8f8e89}
.thumb canvas{width:96px;height:48px;image-rendering:pixelated;display:block}
.thumb.cur{outline:3px solid var(--or);outline-offset:-1px}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fields label{margin:6px 0 3px}
.anim{border-top:1.5px solid var(--line);margin-top:14px;padding-top:2px}
.nudge{display:grid;grid-template-columns:repeat(4,44px);gap:4px}
.empty{color:var(--muted);font-size:12px;padding:10px 0}
.h3{font:700 18px/1 var(--disp);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--line);padding-bottom:4px}
.h3 b{font:600 10px/1 "IBM Plex Mono",monospace;letter-spacing:.06em}
.h3 b{color:var(--or)}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.libit{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px;min-height:0;text-transform:none}
.libit canvas{width:100%;aspect-ratio:2/1;image-rendering:pixelated;background:#000;display:block}
.libit span{font:500 10px/1.1 "IBM Plex Mono",monospace;text-align:left}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}

/* modales */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal{background:var(--paper);width:100%;max-width:580px;max-height:92vh;overflow:auto;border:1.5px solid var(--line);border-bottom:0;
  padding:0 0 calc(16px + env(safe-area-inset-bottom,0px))}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1.5px solid var(--line);background:var(--ink);color:var(--bg)}
.mhead h2{margin:0;font:800 24px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.mhead button{background:transparent;color:var(--bg);border-color:var(--bg);min-height:30px}
.mbody{padding:10px 12px}
.msec{border-top:1.5px solid var(--line);margin-top:14px;padding-top:4px}
.code{width:100%;min-height:44vh;white-space:pre;resize:vertical;background:#0c0c0c;color:#ffb020;border:1.5px solid var(--line);font:12px/1.5 "IBM Plex Mono",monospace;padding:10px}
.gifprev{display:block;width:100%;image-rendering:pixelated;background:#000;border:1.5px solid var(--line);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--line);margin-top:8px}
.stats div{padding:6px 8px;border-right:1px solid var(--soft);font-size:10px;text-transform:uppercase;color:var(--muted)}
.stats div:last-child{border-right:0}
.stats b{display:block;font:700 24px/1.1 var(--disp);color:var(--ink)}
.sharecv{display:block;width:100%;max-width:300px;margin:10px auto 0;border:2px solid var(--line);background:#D5D6D7}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border:1.5px solid var(--or);
  padding:8px 14px;font-size:12px;text-transform:uppercase;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ===== instrumento de mano U-MA ===== */
:root{--backdrop:#1C1D1F;--body:#D5D6D7}
:root[data-theme="dark"]{--backdrop:#000;--body:#2B2C2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--backdrop:#000;--body:#2B2C2E}}
html,body{background:var(--backdrop)}
body{background-image:none}
.app{max-width:580px;margin:10px auto 26px;padding:12px 10px 20px;background:var(--body);background-image:var(--tex);
  border:3px solid #0d0d0d;border-radius:34px;position:relative;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.22),inset 3px 0 0 rgba(255,255,255,.18),0 22px 50px rgba(0,0,0,.55)}
.app::after{content:"";position:absolute;right:-9px;top:150px;width:7px;height:46px;border-radius:0 6px 6px 0;background:linear-gradient(90deg,#9a9b9d,#d9dadb);border:2px solid #0d0d0d;border-left:0}
.stick{background:var(--body);background-image:var(--tex);margin:-6px -2px 0;padding:6px 2px 0}
.top{background:#121314;color:#EFEFEE;border-radius:20px;padding:7px 6px 7px 8px;gap:6px;align-items:center;margin-bottom:0;
  box-shadow:inset 0 2px 8px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.55);border:2px solid #0d0d0d}
.top .logo{width:72px}
.top .logo svg{width:72px;filter:none}
.top .bt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:0 2px 0 4px}
.top .bt b{font:800 22px/.95 var(--disp);text-transform:uppercase;letter-spacing:.01em;color:#EFEFEE}
.top .bl{font:500 8.5px/1 "IBM Plex Mono",monospace;font-style:normal;letter-spacing:.1em;color:#8a8b8d;margin-bottom:3px}
.top #pname{font-size:9.5px;color:#9a9b9d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.04em}
.segs{display:flex;gap:2px;margin-top:4px}
.segs i{flex:1;max-width:7px;height:4px;background:#2c2d2f;border-radius:1px}
.segs i.on{background:#ffb020;box-shadow:0 0 4px rgba(255,176,32,.6)}
.led{width:8px;height:8px;border-radius:50%;background:var(--cya);box-shadow:0 0 6px var(--cya),inset 0 -1px 1px rgba(0,0,0,.4);flex:none;align-self:flex-start;margin-top:4px}
.top .bi{width:36px;min-width:36px;min-height:36px;padding:0;display:grid;place-items:center;border-radius:12px;border:2px solid #000;background:linear-gradient(#2d2e30,#1b1c1e);color:#EFEFEE;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.12)}
.top .bi svg.px{width:16px;height:16px}
.top .bi.lang{width:auto;min-width:44px;padding:0 6px;font:700 10px/1 "IBM Plex Mono",monospace;letter-spacing:.06em}
.grille{height:20px;margin:7px 10px 7px;border-radius:10px;background:radial-gradient(circle,#161617 1.3px,transparent 1.7px) 0 0/6px 6px;display:flex;justify-content:space-between;align-items:center;padding:0 4px}

:root[data-theme="dark"] .grille span{color:#8a8b8d}
.device{border-radius:0;border:3px solid #0d0d0d;box-shadow:none}
.device.dev1{border-radius:22px 22px 0 0;border-bottom:0;box-shadow:inset 0 3px 10px rgba(0,0,0,.7)}
.device.dev2{border-radius:0 0 22px 22px;border-top:0;padding-bottom:12px}
.bezel{border-radius:10px;border:2px solid #2a2b2d;box-shadow:inset 0 0 0 2px #000,inset 0 4px 14px rgba(0,0,0,.9)}
.haz{border-radius:8px;margin:8px 4px 0;height:10px}
.blk{border-radius:18px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);border:3px solid #0d0d0d;margin-top:10px}
.blk .tag{background:rgba(255,255,255,.06)}
.tabs{margin-top:12px;gap:4px}
.tab,.tab:last-child{border:3px solid #0d0d0d;border-bottom:0;border-radius:14px 14px 0 0;box-shadow:none}
#panel{border:3px solid #0d0d0d;border-top:3px solid #0d0d0d;border-radius:0 0 18px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
button{border-radius:10px;border-width:2px;box-shadow:0 2px 0 var(--line)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.tool{border-radius:12px;background:linear-gradient(var(--chip),color-mix(in srgb,var(--chip) 88%,#000));box-shadow:0 3px 0 var(--line),inset 0 1px 0 rgba(255,255,255,.5)}
.tool[aria-pressed="true"]{box-shadow:0 1px 0 var(--line),inset 0 2px 4px rgba(0,0,0,.25);transform:translateY(2px)}
.lv{border-radius:7px;box-shadow:0 2px 0 #111}
.row button,.caret,.row .ic,.row .name,.tab,.device .key,.knob{box-shadow:none}
.device .key{box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.1)}
.device button{border-radius:9px;box-shadow:0 2px 0 #000}
.device .dbtn button{border-radius:8px}
.modal{border-radius:24px 24px 0 0;border:3px solid #0d0d0d;border-bottom:0}
.mhead{border-radius:21px 21px 0 0}
.toast{border-radius:14px}
.textsheet{background:rgba(0,0,0,.18)}
.textsheet .modal{max-height:calc(100vh - var(--stk,0px) - 6px)}
.fontgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fontbtn{display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:4px;min-height:0;text-transform:none}
.fontbtn canvas{width:100%;aspect-ratio:128/20;image-rendering:pixelated;background:#000;border-radius:5px;display:block}
.fontbtn span{font:500 9.5px/1.1 "IBM Plex Mono",monospace;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.tabs .tab{padding:6px 2px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

res apps.", "स्प्राइट शीट सभी फ़्रेम अगल-बगल रखती है, दूसरे ऐप में एनिमेशन के लिए उपयोगी।", "精灵图把所有帧并排排列，便于在其他应用中制作动画。"], "La mayoría de los efectos convierten la selección en píxeles; contorno, sombra, resplandor, eco y destellos agregan un objeto nuevo agrupado con el original.": ["Die meisten Effekte wandeln die Auswahl in Pixel um; Kontur, Schatten, Glühen, Echo und Funkeln fügen ein neues, mit dem Original gruppiertes Objekt hinzu.", "La plupart des effets convertissent la sélection en pixels ; contour, ombre, lueur, écho et étincelles ajoutent un nouvel objet groupé avec l'original.", "ज़्यादातर इफ़ेक्ट चयन को पिक्सेल में बदलते हैं; आउटलाइन, छाया, ग्लो, इको और चमक मूल के साथ समूहित नया ऑब्जेक्ट जोड़ते हैं।", "大多数效果会把所选内容转为像素；描边、阴影、发光、回声和闪光会新增一个与原对象编组的对象。"], "La respuesta no trajo nada dibujable. Probá describirlo de otra forma.": ["Die Antwort enthielt nichts Zeichenbares. Beschreibe es anders.", "La réponse ne contenait rien de dessinable. Décrivez-le autrement.", "जवाब में बनाने लायक कुछ नहीं था। अलग तरीके से बताएँ।", "回复中没有可绘制的内容，请换种描述。"], "Las descargas no están disponibles en esta vista: mantené presionada la imagen para guardarla.": ["Downloads hier nicht verfügbar: halte das Bild gedrückt, um es zu speichern.", "Téléchargements indisponibles ici : appui long sur l'image pour l'enregistrer.", "यहाँ डाउनलोड नहीं: छवि को देर तक दबाकर सहेजें।", "此处无法下载：长按图片即可保存。"], "Librería": ["Bibliothek", "Bibliothèque", "लाइब्रेरी", "素材库"], "Listo: {n} objetos agrupados en “{c}”. Desagrupá para editar cada parte.": ["Fertig: {n} Objekte gruppiert in „{c}“. Löse die Gruppe, um jeden Teil zu bearbeiten.", "Terminé : {n} objets groupés dans « {c} ». Dégroupez pour modifier chaque partie.", "हो गया: {n} ऑब्जेक्ट “{c}” में समूहित। हर हिस्सा बदलने के लिए समूह हटाएँ।", "完成：{n} 个对象已编组到“{c}”。取消编组可分别编辑。"], "Llega como una capa nueva, con cada parte como objeto editable.": ["Kommt als neue Ebene, jeder Teil ein bearbeitbares Objekt.", "Arrive comme nouveau calque, chaque partie ét function setShapeLevel(s,l){s.level=l;if(s.type==='pixels')for(let i=2;i<s.d.length;i+=3)s.d[i]=l}
function selLevels(ss){let mn=99,mx=-1;for(const s of ss){if(s.type==='pixels'){for(let i=2;i<s.d.length;i+=3){const v=s.d[i];mn=Math.min(mn,v);mx=Math.max(mx,v)}}else if(s.level>0||s.lv0){mn=Math.min(mn,s.level);mx=Math.max(mx,s.level)}}return mx<0?null:{mn,mx}}

 for(const s of ss){if(s.type==='pixels'){for(let i=2;i<s.d.length;i+=3)s.d[i]=clamp(s.d[i]+delta,0,15);s.level=clamp(s.level+delta,0,15)}
  else if(s.level>0||s.lv0){s.level+=delta;s.lv0=s.level===0}}
 return delta}
function pickLevel(l,rel){const ss=selShapes().filter(s=>!s.locked);

/* ---------- selección ---------- */
function covers(s,p,tol){let f=false;raster(s,(x,y)=>{if(!f&&Math.abs(x-p.x)<=tol&&Math.abs(y-p.y)<=tol)f=true});return f}
function hitAt(p){const fr=project.frames[cur.f];
 for(const tol of[0,1])for(let li=fr.layers.length-1;li>=0;li--){const ly=fr.layers[li];if(!ly.visible||ly.locked)continue;
  for(let i=ly.shapes.length-1;i>=0;i--){const s=ly.shapes[i];if(!s.hidden&&!s.locked&&covers(s,p,tol))return{l:li,i}}}
 return null}
function groupIdx(ly,i){const g=ly.shapes[i].group;if(!g)return[i];const r=[];ly.shapes.forEach((s,j)=>{if(s.group===g)r.push(j)});return r}
function selectObj(li,i,additive){const ly=project.frames[cur.f].layers[li];const ids=groupIdx(ly,i);
 if(additive&&li===cur.l&&!layerSel){const has=ids.every(j=>sel.includes(j));sel=has?sel.filter(j=>!ids.includes(j)):[...new Set([...sel,...ids])]}
 else sel=ids;
 cur.l=li;layerSel=false;sel.sort((a,b)=>a-b)}
function selectLayer(li){cur.l=li;const ly=L();sel=ly.shapes.map((_,i)=>i);layerSel=true}
function clearSel(){sel=[];layerSel=false}

function addPix(obj,map,x,y,v){if(x<0||y<0||x>=W||y>=H)return;const k=y*W+x;const at=map.get(k);if(at!=null)obj.d[at+2]=v;else{map.set(k,obj.d.length);obj.d.push(x,y,v)}}
function erasePix(ly,x,y){for(const s of ly.shapes){if(s.type!=='pixels'||s.hidden||s.locked)continue;const d=s.d;for(let i=d.length-3;i>=0;i-=3)if(d[i]===x&&d[i+1]===y)d.splice(i,3)}}

function newShapeBase(){return{level,hidden:false,locked:false,group:null}}
function bucket(p){const buf=compose(cur.f,null),tg=buf[p.y*W+p.x],seen=new Uint8Array(N),d=[],st=[p.x,p.y];
 while(st.length){const y=st.pop(),x=st.pop();if(x<0||y<0||x>=W||y>=H)continue;const k=y*W+x;if(seen[k]||buf[k]!==tg)continue;seen[k]=1;d.push(x,y,level);st.push(x+1,y,x-1,y,x,y+1,x,y-1)}
 if(!d.length)return;commit();const ly=L();ly.shapes.push({...newShapeBase(),type:'pixels',name:autoName(ly,'Relleno'),d});refresh()}
function makeShape(tl,a,b){
 const base=newShapeBase();
 if(tl==='line')return{...base,type:'line',x1:a.x,y1:a.y,x2:b.x,y2:b.y};
 if(tl==='rect'||tl==='rectF')return{...base,type:'rect',x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x)+1,h:Math.abs(b.y-a.y)+1,fill:tl==='rectF',button:false,label:'',action:''};

}
function moved(o,dx,dy){const s={...o};
 if(s.type==='line'){s.x1+=dx;s.y1+=dy;s.x2+=dx;s.y2+=dy}else if(s.type==='circle'){s.cx+=dx;s.cy+=dy}
 else if(s.type==='pixels'){s.d=o.d.slice();for(let i=0;i<s.d.length;i+=3){s.d[i]+=dx;s.d[i+1]+=dy}}
 else if(s.type==='poly')s.pts=o.pts.map(([x,y])=>[x+dx,y+dy]);
 else{s.x+=dx;s.y+=dy}return s}
function scaleShape(o,AX,AY,kx,ky){if(ky==null)ky=kx;const s=clone(o);const X=x=>Math.floor(AX+(x+.5-AX)*kx),Y=y=>Math.floor(AY+(y+.5-AY)*ky);
 switch(s.type){
  case 'line':s.x1=X(o.x1);s.y1=Y(o.y1);s.x2=X(o.x2);s.y2=Y(o.y2);break;
  case 'rect':{const x1=Math.round(AX+(o.x-AX)*kx),x2=Math.round(AX+(o.x+o.w-AX)*kx),y1=Math.round(AY+(o.y-AY)*ky),y2=Math.round(AY+(o.y+o.h-AY)*ky);s.x=x1;s.y=y1;s.w=Math.max(1,x2-x1);s.h=Math.max(1,y2-y1);break}
  case 'circle':{if(Math.abs(kx-ky)<0.02){s.cx=X(o.cx);s.cy=Y(o.cy);s.r=Math.max(0,Math.round(o.r*kx));break}
   const cx=AX+(o.cx+.5-AX)*kx-.5,cy=AY+(o.cy+.5-AY)*ky-.5,rx=o.r*kx,ry=o.r*ky,n=clamp(Math.round(Math.max(rx,ry)*2),12,48),pts=[];
   for(let i=0;i<n;i++){const a=i*2*Math.PI/n,p=[Math.round(cx+rx*Math.cos(a)),Math.round(cy+ry*Math.sin(a))];const l=pts[pts.length-1];if(!l||l[0]!==p[0]||l[1]!==p[1])pts.push(p)}
   return{name:o.name,level:o.level,hidden:o.hidden,locked:o.locked,group:o.group,type:'poly',pts,fill:!!o.fill,open:false}}
  case 'poly':s.pts=o.pts.map(([x,y])=>[X(x),Y(y)]);break;
  case 'text':s.x=Math.round(AX+(o.x-AX)*kx);s.y=Math.round(AY+(o.y-AY)*ky);s.size=Math.max(1,Math.round(o.size*ky));break;
  case 'pixels':{const b=bboxOf([o]);if(!b)break;const src=new Map();for(let i=0;i<o.d.length;i+=3)src.set(o.d[i]+','+o.d[i+1],o.d[i+2]);
   const tx0=Math.floor(AX+(b.x0-AX)*kx),tx1=Math.ceil(AX+(b.x1+1-AX)*kx)-1,ty0=Math.floor(AY+(b.y0-AY)*ky),ty1=Math.ceil(AY+(b.y1+1-AY)*ky)-1,d=[];
   for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const v=src.get(Math.floor(AX+(tx+.5-AX)/kx)+','+Math.floor(AY+(ty+.5-AY)/ky));if(v!=null)d.push(tx,ty,v)}
   if(!d.length)d.push(X(b.x0),Y(b.y0),o.level);s.d=d;break}
 }

function distTo(e,h){const r=ovl.getBoundingClientRect();return Math.hypot(e.clientX-r.left-h.x,e.clientY-r.top-h.y)}
function startScale(){const ly=L();const list=sel.map(i=>ly.shapes[i]);const b=bboxOf(list.filter(s=>!s.hidden));if(!b)return false;

function regularPts(n,r,cx,cy,star,inner){const pts=[],m=star?n*2:n;for(let i=0;i<m;i++){const a=-Math.PI/2+i*2*Math.PI/m,rr=star&&i%2?r*inner:r;const p=[Math.round(cx+rr*Math.cos(a)),Math.round(cy+rr*Math.sin(a))];const l=pts[pts.length-1];if(!l||l[0]!==p[0]||l[1]!==p[1])pts.push(p)}
 if(pts.length>1){const a=pts[0],b=pts[pts.length-1];if(a[0]===b[0]&&a[1]===b[1])pts.pop()}return pts}

const touches=new Map();let pinch=null,pinchLock=false;
function cancelDrag(){if(!drag)return;if(drag.committed){const s=undoS.pop();if(s)restore(s)}temp=null;drag=null;render()}
function pinchInfo(){const[a,b]=[...touches.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}}

 if(touches.size>=2){try{ovl.setPointerCapture(e.pointerId)}catch(_){}cancelDrag();if(!pinch){const i=pinchInfo();pinch={d0:i.d,z0:zoom,m:i.m};pinchLock=true}return}

 else if(tool==='bucket'){if(inb(p)&&!layerBlocked())bucket(p)}

 else if(tool==='poly'){if(layerBlocked())return;
  if(!poly){if(inb(p))polyModal(p);return}
  const f=poly.pts[0];const r=ovl.getBoundingClientRect();const fx=(f[0]+.5)*zoom,fy=(f[1]+.5)*zoom;

  const l=poly.pts[poly.pts.length-1];if(l[0]!==p.x||l[1]!==p.y){if(poly.pts.length>=POLY_MAX){toast(tf('Máximo {n} vértices',{n:POLY_MAX}));return}poly.pts.push([p.x,p.y])}

  const h=hitAt(p);
  if(!h){if(!multi)clearSel();drag={t:'marquee',start:p,end:p}}
  else{
   const already=h.l===cur.l&&sel.includes(h.i);
   if(multi)selectObj(h.l,h.i,true);
   else if(selMode==='layer')selectLayer(h.l);
   else if(!already)selectObj(h.l,h.i,false);
   if(sel.includes(h.i)||layerSel)drag={t:'move',start:p,orig:clone(L().shapes),idx:sel.slice(),committed:false};
  }

});

function knob(elm,step){let acc=0,last=null,ang=0;const ind=elm.querySelector('i');

 elm.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY};acc=0;try{elm.setPointerCapture(e.pointerId)}catch(_){}});
 elm.addEventListener('pointermove',e=>{if(!last)return;acc+=(e.clientX-last.x)-(e.clientY-last.y);last={x:e.clientX,y:e.clientY};while(Math.abs(acc)>=14){turn(Math.sign(acc));acc-=Math.sign(acc)*14}});
 const up=()=>{last=null};elm.addEventListener('pointerup',up);elm.addEventListener('pointercancel',up);

const KY=(x,y)=>x+','+y,PK=k=>k.split(',').map(Number);
const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
const B8=[[0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],[3,35,11,43,1,33,9,41],[51,19,59,27,49,17,57,25],[15,47,7,39,13,45,5,37],[63,31,55,23,61,29,53,21]];
function odGrad(m,b,f){return mapEach(m,(x,y,v,o)=>{const tt=clamp(f(x,y),0,1);if(tt*64>B8[((y%8)+8)%8][((x%8)+8)%8])o.set(KY(x,y),v)})}
const odT=(a,b0,b1)=>b1===b0?1:(a-b0)/(b1-b0);
function mapEach(m,f){const o=new Map();for(const[k,v]of m){const[x,y]=PK(k);f(x,y,v,o)}return o}
const N4=[[1,0],[-1,0],[0,1],[0,-1]];
function fsDither(m,b,levels){const w=b.x1-b.x0+1,h=b.y1-b.y0+1,v=new Float32Array(w*h),has=new Uint8Array(w*h);
 for(const[k,val]of m){const[x,y]=PK(k);const i=(y-b.y0)*w+(x-b.x0);v[i]=val;has[i]=1}
 const o=new Map(),opts=[0,...levels];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;if(!has[i])continue;const old=v[i];let q=0;for(const l of opts)if(Math.abs(l-old)<Math.abs(q-old))q=l;
  const e=old-q;if(q>0)o.set(KY(x+b.x0,y+b.y0),q);
  const push=(dx,dy,f)=>{const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)return;const j=yy*w+xx;if(has[j])v[j]+=e*f};
  push(1,0,7/16);push(-1,1,3/16);push(0,1,5/16);push(1,1,1/16)}
 return o}

function applyFx(k){
 const ly=L();const ss=selShapes().filter(s=>!s.locked&&!s.hidden);
 if(!ss.length){toast(t('Seleccioná algo primero'));return}
 const[name,mode,fn]=FX[k];const m=toPixelMap(ss);const b=bboxOf(ss);const out=fn(m,b);
 if(!out.size){toast(t('No quedó nada con ese efecto'));return}
 commit();
 if(mode==='rep'){const at=Math.min(...sel);const obj={...newShapeBase(),type:'pixels',name:t(name)+': '+(ss.length===1?ss[0].name:t('selección')),level:ss[0].level,group:ss[0].group&&ss.every(s=>s.group===ss[0].group)?ss[0].group:null,d:mapToD(out)};
  ly.shapes=ly.shapes.filter(s=>!ss.includes(s));ly.shapes.splice(Math.min(at,ly.shapes.length),0,obj);sel=[ly.shapes.indexOf(obj)];}
 else{const g=ss.find(s=>s.group)?.group||newGroup();ss.forEach(s=>s.group=g);
  const obj={...newShapeBase(),type:'pixels',name:t(name),level:3,group:g,d:mapToD(out)};
  const at=Math.min(...sel);ly.shapes.splice(at,0,obj);sel=ly.shapes.map((s,i)=>s.group===g?i:-1).filter(i=>i>=0);}
 layerSel=false;lastSelKey=cur.f+':'+cur.l+':'+sel.join(',');selFillHidden=true;toast(tf('{n} aplicado',{n:t(name)}));refresh();

function alongPath(v,n,closed){const segs=[];const m=closed?v.length:v.length-1;let tot=0;for(let i=0;i<m;i++){const a=v[i],b=v[(i+1)%v.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push([a,b,l]);tot+=l}
 const out=[];for(let k=0;k<n;k++){let d=closed?k*tot/n:k*tot/Math.max(1,n-1);for(const[a,b,l]of segs){if(d<=l+1e-9){const f=l?d/l:0;out.push([Math.round(a[0]+(b[0]-a[0])*f),Math.round(a[1]+(b[1]-a[1])*f)]);break}d-=l}}return out}

/* ---------- IA ---------- */
const AI_RULES=`Sos un ilustrador experto en la pantalla OLED del monome norns: 128x64 píxeles, 16 niveles de brillo (0 = negro, 15 = máximo). El fondo es negro.
Dibujá lo que se pide con primitivas, pensando en una silueta reconocible a muy baja resolución.
Estética norns: líneas de 1 px nítidas, formas simples, nivel 15 para contornos y lo principal, niveles 3 a 10 para rellenos, sombras y detalles secundarios. Sin texto salvo que se pida.
Coordenadas enteras, todo dentro de x 0..127, y 0..63. Si no se indica posición ni tamaño, centralo y hacelo ocupar entre el 60 y el 85 % del alto.
Para siluetas orgánicas usá "poly" (polígonos de muchos vértices) o "pixels". Un círculo o polígono lleno de nivel 0 sirve para recortar huecos.
Orden: del fondo hacia el frente; lo que va encima va al final. Máximo 150 elementos. Poné "name" a cada parte, corto.
Respondé SOLO con JSON válido, sin texto extra ni backticks, con esta forma:
{"name":"nombre corto del dibujo","elements":[
 {"type":"line","name":"...","x1":0,"y1":0,"x2":10,"y2":5,"level":15},
 {"type":"rect","name":"...","x":0,"y":0,"w":10,"h":5,"fill":false,"level":15},
 {"type":"circle","name":"...","cx":64,"cy":32,"r":10,"fill":false,"level":15},
 {"type":"poly","name":"...","pts":[[x,y],[x,y],[x,y]],"fill":false,"level":15},
 {"type":"pixels","name":"...","level":15,"points":[[x,y],[x,y,nivelOpcional]]},
 {"type":"text","name":"...","x":0,"y":10,"text":"hola","font":1,"size":8,"level":15}
]}`;

 if(aiCtl){aiCtl.abort();return}
 if(!q){st.textContent=t('Escribí qué querés que dibuje, por ejemplo "un perro sentado mirando a la izquierda".');return}

 aiCtl=new AbortController();btn.textContent=t('Cancelar');st.textContent=t('Dibujando… puede tardar hasta un minuto.');

  const res=await sample.json(input,{signal:aiCtl.signal,modelTier:'complex'});
  const g=newGroup();
  const els=(res&&Array.isArray(res.elements)?res.elements:[]).slice(0,300).map(o=>sanitizeShape({...o,group:null})).filter(Boolean);
  if(!els.length){st.textContent=t('La respuesta no trajo nada dibujable. Probá describirlo de otra forma.');return}
  commit();const ly=newLayer('IA: '+String(res.name||q).slice(0,28));
  for(const s of els){if(!s.name)s.name=autoName(ly,TYPE_NAMES[s.type]);s.group=g;ly.shapes.push(s)}
  project.frames[cur.f].layers.splice(cur.l+1,0,ly);cur.l++;sel=ly.shapes.map((_,i)=>i);layerSel=false;if(tool!=='select')setTool('select');
  tab='layers';refresh();renderPanel(true);st.textContent=tf('Listo: {n} objetos agrupados en “{c}”. Desagrupá para editar cada parte.',{n:els.length,c:ly.name});
 }catch(e){
  const c=e&&e.code;
  st.textContent=t(c==='cancelled'?'Cancelado.':c==='not_granted'?'No se dio permiso para usar la IA.':c==='rate_limited'?'Demasiados pedidos seguidos; esperá un momento.':'No se pudo generar el dibujo. Probá de nuevo o con otra descripción.');
  if(c==='not_granted')$('#ai').hidden=true;
 }finally{aiCtl=null;btn.textContent=t('Dibujar')}
}

     el('div',{class:'bar'},el('button',{class:'primary',text:t('Copiar código'),onclick:()=>copyText(ta)}),dl?el('button',{text:t('Descargar'),onclick:()=>saveFile(slug()+'.lua.txt',ta.value)}):null),
     el('p',{class:'hint',text:t('Coordenadas con .5 para que cairo pinte los mismos píxeles.')+' '+(dl&&!dl.web?t('La descarga llega como .lua.txt: quitale el .txt.'):'')}));
   }else if(mode==='gif'){
    const sc=el('select',{},...[1,2,4,6,8].map(v=>{const o=el('option',{value:v,text:v+'× ('+W*v+'×'+H*v+')'});if(v===4)o.selected=true;return o}));
    const img=el('img',{class:'gifprev',alt:t('Vista previa del GIF')});
    const du=el('input',{type:'number',min:1,max:30,step:1,value:4});let data=null;const build=()=>{data=makeGif(+sc.value,+du.value||4);if(gifURL)URL.revokeObjectURL(gifURL);gifURL=URL.createObjectURL(new Blob([data],{type:'image/gif'}));img.src=gifURL};

     el('div',{class:'bar'},dl?el('button',{class:'primary',text:t('Descargar GIF'),onclick:()=>{if(data)saveFile(slug()+'.gif',new Blob([data],{type:'image/gif'}))}}):null),
     el('p',{class:'hint',text:t('Anima todos los frames en loop a los fps del proyecto, con la paleta ámbar de 16 niveles.')+(dl?'':' '+t('Las descargas no están disponibles en esta vista: mantené presionada la imagen para guardarla.'))}));

    body.append(el('label',{text:t('Escala')}),sc,el('div',{class:'bar'},

  }

let toastT=null;function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1800)}
function measureStick(){const st=$('#stick');if(!st)return;st.classList.remove('off');const h=st.offsetHeight;if(h>window.innerHeight*0.72)st.classList.add('off');document.documentElement.style.setProperty('--stk',(st.classList.contains('off')?0:h)+'px')}
window.addEventListener('resize',()=>{measureStick();const wasFit=Math.abs(zoom-fitZ)<0.01;measureFit();if(wasFit||zoom<fitZ)zoom=fitZ;applyZoom();render()});

(function init(){
 const th=store.get('nc_theme');if(th)document.documentElement.setAttribute('data-theme',th);
 applyI18n();
 const saved=store.get('nc_autosave');if(saved){try{project=deserialize(saved)}catch(_){project=newProject()}}
 buildTools();measureFit();zoom=fitZ;applyZoom();measureStick();
 setTool('pencil');tab='layers';refresh();
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{textCache.clear();render();measureStick()});
})();
